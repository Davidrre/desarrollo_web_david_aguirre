{% extends "base.html" %}

{% block title %}Estadísticas{% endblock %}

{% block content %}
<section id="seccion-estadisticas">
  <h2>Estadísticas</h2>

  <div class="grafico" id="grafico-dias"
       data-url="{{ url_for('estadisticas_avistamientos_por_dia') }}"></div>

  <div class="grafico" id="grafico-aves"
       data-url="{{ url_for('estadisticas_avistamientos_por_ave') }}"></div>

  <div class="grafico" id="grafico-comunas"
       data-url="{{ url_for('estadisticas_voluntarios_por_comuna') }}"></div>

  <a href="{{ url_for('index') }}">Volver a la portada</a>
</section>
{% endblock %}

{% block javascript %}
<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
{% endblock %}
