<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Avistamientos de Aves{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block css %}{% endblock %}
</head>
<body>
  <header>
    <h1>Unión de Ornitólogos de Chile</h1>
    <nav>
      <ul>
        <li><a href="{{ url_for('index') }}">Inicio</a></li>
        <li><a href="{{ url_for('registrar_voluntario') }}">Registrarse</a></li>
        <li><a href="{{ url_for('registrar_avistamiento') }}">Informar avistamiento</a></li>
        <li><a href="{{ url_for('listado_avistamientos') }}">Ver avistamientos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block javascript %}{% endblock %}
</body>
</html>
